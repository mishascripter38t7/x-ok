<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xok — Shorts & Photos</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 24, 38, 0.75);
      --border-steel: rgba(255, 255, 255, 0.15);
      --accent-cyan: #00f2fe;
      --accent-pink: #ff0050;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --metal-gradient: linear-gradient(135deg, #1c2333 0%, #0d1117 50%, #161b22 100%);
      --glow-cyan: 0 0 20px rgba(0, 242, 254, 0.4);
      --glow-pink: 0 0 20px rgba(255, 0, 80, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body, html { width: 100%; height: 100%; background: var(--bg-dark); color: var(--text-main); overflow: hidden; }

    .icon { width: 22px; height: 22px; fill: currentColor; }

    /* Auth Overlay */
    .auth-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 6, 10, 0.92); backdrop-filter: blur(25px);
      z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .auth-card {
      width: 100%; max-width: 400px; background: var(--metal-gradient);
      border: 1px solid var(--border-steel); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), var(--glow-cyan);
      border-radius: 24px; padding: 28px;
    }
    .auth-tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border-steel); padding-bottom: 12px; }
    .auth-tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); font-weight: 700; font-size: 14px; padding: 8px; cursor: pointer; }
    .auth-tab-btn.active { color: var(--accent-cyan); border-bottom: 2px solid var(--accent-cyan); text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }

    .avatar-preview-wrapper { width: 76px; height: 76px; margin: 0 auto 16px auto; border-radius: 50%; border: 2px solid var(--accent-cyan); box-shadow: var(--glow-cyan); overflow: hidden; cursor: pointer; }
    .avatar-preview-img { width: 100%; height: 100%; object-fit: cover; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .input-field { width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-steel); border-radius: 12px; padding: 12px 14px; color: #fff; font-size: 14px; outline: none; }
    .input-field:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }

    .auth-submit-btn { width: 100%; margin-top: 10px; background: linear-gradient(90deg, #00f2fe, #4facfe); border: none; color: #000; font-weight: 800; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 14px; }

    /* Header with Metallic Gradient Logo */
    .xok-header {
      position: fixed; top: 0; left: 0; right: 0; height: 64px; padding: 0 20px;
      display: flex; justify-content: space-between; align-items: center; z-index: 100;
      background: linear-gradient(to bottom, rgba(7, 9, 14, 0.9), transparent); backdrop-filter: blur(12px);
    }
    .xok-logo {
      font-weight: 900; font-size: 22px; letter-spacing: 1.5px;
      background: linear-gradient(135deg, #00f2fe 0%, #ffffff 50%, #ff0050 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0,242,254,0.4));
      cursor: pointer;
    }
    .btn-create { background: linear-gradient(90deg, var(--accent-cyan), #00c6ff); color: #000; border: none; font-weight: 800; padding: 8px 16px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; box-shadow: var(--glow-cyan); }
    .user-profile-badge { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--accent-cyan); object-fit: cover; cursor: pointer; }

    /* Feed Container */
    .xok-container {
      width: 100vw; height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .xok-card {
      position: relative; width: 100vw; height: 100vh;
      scroll-snap-align: start; scroll-snap-stop: always;
      background: #000; display: flex; justify-content: center; align-items: center;
    }
    .xok-card video, .xok-card img.media-content { width: 100%; height: 100%; object-fit: cover; }

    .overlay {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 20px;
      background: linear-gradient(transparent, rgba(7, 9, 14, 0.95));
      display: flex; justify-content: space-between; align-items: flex-end; z-index: 20;
    }
    .user-info { display: flex; align-items: center; gap: 12px; max-width: 75%; }
    .user-avatar-post { width: 44px !important; height: 44px !important; min-width: 44px !important; border-radius: 50% !important; object-fit: cover !important; border: 2px solid var(--accent-cyan) !important; box-shadow: var(--glow-cyan); cursor: pointer; }

    .sound-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent-cyan); margin-top: 6px; }

    .side-bar { display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .action-btn {
      background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border-steel);
      width: 46px; height: 46px; border-radius: 50%; color: #fff; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(12px);
    }
    .action-btn span { font-size: 10px; margin-top: 2px; color: var(--text-muted); }

    /* Modals (Profile, Comments, Upload) */
    .modal-bottom {
      position: fixed; bottom: -100%; left: 0; right: 0; height: 75vh;
      background: var(--metal-gradient); border-top: 1px solid var(--border-steel);
      border-radius: 24px 24px 0 0; z-index: 200; transition: bottom 0.3s ease-in-out;
      padding: 20px; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
    }
    .modal-bottom.active { bottom: 0; }

    .profile-header-card { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-steel); }
    .profile-avatar-large { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--accent-cyan); object-fit: cover; }
    .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 16px; overflow-y: auto; flex: 1; }
    .profile-grid-item { aspect-ratio: 9/16; background: #111; border-radius: 8px; overflow: hidden; }
    .profile-grid-item video, .profile-grid-item img { width: 100%; height: 100%; object-fit: cover; }

    .comments-list { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 10px; }
    .comment-item { display: flex; gap: 10px; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 10px; }
    .comment-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }

    .error-toast {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 0, 80, 0.95); color: #fff; padding: 10px 22px;
      border-radius: 30px; font-size: 13px; font-weight: 700; z-index: 1000; display: none;
    }
  </style>
</head>
<body>

  <!-- SVG Icons -->
  <svg style="display: none;">
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
    <symbol id="icon-comment" viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></symbol>
    <symbol id="icon-share" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></symbol>
    <symbol id="icon-music" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></symbol>
  </svg>

  <div id="errorToast" class="error-toast"></div>

  <!-- Auth Modal -->
  <div id="authModal" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabReg" onclick="switchAuth('reg')">Регистрация</button>
        <button class="auth-tab-btn" id="tabLog" onclick="switchAuth('log')">Вход</button>
      </div>

      <div id="regForm">
        <div class="avatar-preview-wrapper" onclick="document.getElementById('avatarFile').click()">
          <img id="avatarPreview" class="avatar-preview-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=Xok" alt="Avatar">
        </div>
        <input type="file" id="avatarFile" accept="image/*" style="display:none;" onchange="handleAvatar(event)">
        <div class="form-group"><label>Никнейм</label><input type="text" id="regDN" class="input-field" placeholder="Миша"></div>
        <div class="form-group"><label>Уникальный @username</label><input type="text" id="regUN" class="input-field" placeholder="misha_dev"></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="regPW" class="input-field" placeholder="••••••••"></div>
        <button class="auth-submit-btn" onclick="submitReg()">Создать аккаунт Xok</button>
      </div>

      <div id="logForm" style="display:none;">
        <div class="form-group"><label>@username</label><input type="text" id="logUN" class="input-field" placeholder="@misha_dev"></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="logPW" class="input-field" placeholder="••••••••"></div>
        <button class="auth-submit-btn" onclick="submitLog()">Войти в Xok</button>
      </div>
    </div>
  </div>

  <!-- Header with Metallic Logo -->
  <header class="xok-header">
    <div class="xok-logo" onclick="window.scrollTo({top:0, behavior:'smooth'})">XOK</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn-create" onclick="openUpload()">
        <svg class="icon" style="fill:#000; width:16px; height:16px;"><use href="#icon-plus"/></svg> Создать
      </button>
      <img id="headerAvatar" class="user-profile-badge" src="https://api.dicebear.com/7.x/bottts/svg?seed=Xok" alt="Profile" onclick="openProfile(currentUser ? currentUser.username : '@guest')">
    </div>
  </header>

  <!-- Feed -->
  <div class="xok-container" id="feed"></div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal-bottom">
    <div style="display:flex; justify-content:flex-end; padding-bottom:10px;">
      <button onclick="closeProfile()" style="background:none; border:none; color:#fff; cursor:pointer;"><svg class="icon"><use href="#icon-close"/></svg></button>
    </div>
    <div class="profile-header-card">
      <img id="profileAvatar" class="profile-avatar-large" src="" alt="Avatar">
      <div>
        <h2 id="profileName" style="font-size:18px;"></h2>
        <span id="profileUserTag" style="font-size:13px; color:var(--text-muted);"></span>
      </div>
      <button onclick="logout()" style="margin-left:auto; background:none; border:1px solid var(--accent-pink); color:var(--accent-pink); padding:6px 12px; border-radius:10px; font-size:12px; cursor:pointer;">Выйти</button>
    </div>
    <div class="profile-grid" id="profileGrid"></div>
  </div>

  <!-- Comments Modal -->
  <div id="commentsModal" class="modal-bottom">
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid var(--border-steel);">
      <h3>Комментарии</h3>
      <button onclick="closeComments()" style="background:none; border:none; color:#fff; cursor:pointer;"><svg class="icon"><use href="#icon-close"/></svg></button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div style="display:flex; gap:10px; padding-top:10px;">
      <input type="text" id="commentInput" class="input-field" placeholder="Написать комментарий...">
      <button class="action-btn" onclick="submitComment()" style="width:46px; height:46px; border-radius:12px;"><svg class="icon"><use href="#icon-send"/></svg></button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal-bottom">
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid var(--border-steel);">
      <h3 style="font-size:16px;">Публикация контента</h3>
      <button onclick="closeUpload()" style="background:none; border:none; color:#fff; cursor:pointer;"><svg class="icon"><use href="#icon-close"/></svg></button>
    </div>
    <div style="overflow-y:auto; flex:1; padding-top:16px;">
      <div class="form-group"><label>Медиафайл (Видео или Фото)</label><input type="file" id="upFile" class="input-field" accept="video/*,image/*"></div>
      <div class="form-group">
        <label>Музыка из SoundCloud</label>
        <select id="soundCloudSelect" class="input-field">
          <option value="Janina Terranova — Ambient Mix">🎧 Janina Terranova — Ambient Mix</option>
          <option value="Phonk Drift — SoundCloud Edition">🔥 Phonk Drift — SoundCloud</option>
          <option value="Lofi Chill Beats — SC Radio">🌙 Lofi Chill Beats — SC Radio</option>
        </select>
      </div>
      <div class="form-group"><label>Описание</label><textarea id="upDesc" class="input-field" rows="3" placeholder="Расскажите о ролике..."></textarea></div>
      <button class="auth-submit-btn" onclick="submitPost()">Опубликовать</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let registeredUsers = {};
    let customAvatar = null;
    let currentPostId = null;
    const BAD_WORDS = ["бля", "блять", "хуй", "хуесос", "пидор", "пидр", "чмо", "ебать", "гандон", "порно", "18+"];

    function openDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open('XokDatabase', 3);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('posts')) db.createObjectStore('posts', { keyPath: 'id' });
        };
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    async function savePostToDB(post) {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction('posts', 'readwrite');
        tx.objectStore('posts').put(post);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    }

    async function loadPostsFromDB() {
      const db = await openDB();
      return new Promise((res, rej) => {
        const tx = db.transaction('posts', 'readonly');
        const req = tx.objectStore('posts').getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    let posts = [
      {
        id: 1,
        src: 'https://assets.mixkit.co/videos/preview/mixkit-tree-branches-in-the-breeze-1187-large.mp4',
        displayName: 'Михаил',
        username: '@misha_dev',
        avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=misha',
        music: 'Janina Terranova — Ambient Mix',
        description: 'Добро пожаловать в Xok! 🚀 #xok',
        likes: 42,
        comments: []
      }
    ];

    window.onload = async () => {
      const u = localStorage.getItem('xok_users');
      if (u) registeredUsers = JSON.parse(u);
      const c = localStorage.getItem('xok_cur');
      if (c) {
        currentUser = JSON.parse(c);
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('headerAvatar').src = currentUser.avatar;
      }

      try {
        const dbPosts = await loadPostsFromDB();
        if (dbPosts && dbPosts.length > 0) {
          posts = dbPosts.sort((a, b) => b.id - a.id);
        }
      } catch (err) { console.error(err); }

      renderFeed();
    };

    function switchAuth(tab) {
      if (tab === 'reg') {
        document.getElementById('tabReg').classList.add('active');
        document.getElementById('tabLog').classList.remove('active');
        document.getElementById('regForm').style.display = 'block';
        document.getElementById('logForm').style.display = 'none';
      } else {
        document.getElementById('tabLog').classList.add('active');
        document.getElementById('tabReg').classList.remove('active');
        document.getElementById('regForm').style.display = 'none';
        document.getElementById('logForm').style.display = 'block';
      }
    }

    function handleAvatar(e) {
      const f = e.target.files[0];
      if (f) {
        const r = new FileReader();
        r.onload = (ev) => { customAvatar = ev.target.result; document.getElementById('avatarPreview').src = customAvatar; };
        r.readAsDataURL(f);
      }
    }

    function checkSafety(t) {
      if (!t) return true;
      const c = t.toLowerCase().replace(/[\s._\-+*]/g, '');
      return !BAD_WORDS.some(w => c.includes(w));
    }

    function toast(m) {
      const t = document.getElementById('errorToast');
      t.innerText = m; t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    function submitReg() {
      const dn = document.getElementById('regDN').value.trim();
      let un = document.getElementById('regUN').value.trim();
      const pw = document.getElementById('regPW').value.trim();
      if (!dn || !un || !pw) return toast('Заполните все поля!');
      if (!un.startsWith('@')) un = '@' + un;
      if (!checkSafety(dn + " " + un)) return toast('Ненормативная лексика!');

      currentUser = { displayName: dn, username: un, password: pw, avatar: customAvatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${un}` };
      registeredUsers[un] = currentUser;
      localStorage.setItem('xok_users', JSON.stringify(registeredUsers));
      localStorage.setItem('xok_cur', JSON.stringify(currentUser));
      document.getElementById('headerAvatar').src = currentUser.avatar;
      document.getElementById('authModal').style.display = 'none';
    }

    function submitLog() {
      let un = document.getElementById('logUN').value.trim();
      const pw = document.getElementById('logPW').value.trim();
      if (!un.startsWith('@')) un = '@' + un;
      if (registeredUsers[un] && registeredUsers[un].password === pw) {
        currentUser = registeredUsers[un];
        localStorage.setItem('xok_cur', JSON.stringify(currentUser));
        document.getElementById('headerAvatar').src = currentUser.avatar;
        document.getElementById('authModal').style.display = 'none';
      } else {
        toast('Неверный логин или пароль!');
      }
    }

    function logout() {
      localStorage.removeItem('xok_cur');
      location.reload();
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';
      posts.forEach(p => {
        const card = document.createElement('div');
        card.className = 'xok-card';

        const isVideo = p.src.startsWith('data:video') || p.src.endsWith('.mp4') || p.src.includes('mixkit');
        const mediaHTML = isVideo 
          ? `<video loop playsinline muted src="${p.src}" onclick="if(this.paused)this.play();else this.pause();"></video>`
          : `<img src="${p.src}" class="media-content">`;

        card.innerHTML = `
          ${mediaHTML}
          <div class="overlay">
            <div class="user-info">
              <img src="${p.avatar}" class="user-avatar-post" onclick="openProfile('${p.username}')">
              <div>
                <strong style="cursor:pointer;" onclick="openProfile('${p.username}')">${escape(p.displayName)}</strong> 
                <span style="font-size:12px; opacity:0.6;">${escape(p.username)}</span>
                <p style="font-size:13px; margin-top:4px;">${escape(p.description)}</p>
                <div class="sound-badge">
                  <svg class="icon" style="width:14px; height:14px;"><use href="#icon-music"/></svg>
                  <span>SoundCloud: ${escape(p.music || 'Original Track')}</span>
                </div>
              </div>
            </div>
            <div class="side-bar">
              <button class="action-btn" onclick="toggleLike(this, ${p.id})">
                <svg class="icon"><use href="#icon-heart"/></svg>
                <span>${p.likes}</span>
              </button>
              <button class="action-btn" onclick="openComments(${p.id})">
                <svg class="icon"><use href="#icon-comment"/></svg>
                <span>${p.comments ? p.comments.length : 0}</span>
              </button>
              <button class="action-btn" onclick="sharePost()">
                <svg class="icon"><use href="#icon-share"/></svg>
              </button>
            </div>
          </div>
        `;
        feed.appendChild(card);
      });
      setupObserver();
    }

    function setupObserver() {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.target.tagName === 'VIDEO') {
            if (e.isIntersecting) e.target.play().catch(()=>{}); else e.target.pause();
          }
        });
      }, { threshold: 0.6 });
      document.querySelectorAll('video').forEach(v => obs.observe(v));
    }

    function toggleLike(btn, id) {
      const p = posts.find(x => x.id === id);
      if (p) {
        p.likes++;
        btn.querySelector('span').innerText = p.likes;
        savePostToDB(p);
      }
    }

    function sharePost() {
      navigator.clipboard.writeText(window.location.href);
      toast('Ссылка скопирована в буфер обмена!');
    }

    // Profile Modal
    function openProfile(username) {
      const modal = document.getElementById('profileModal');
      const userPosts = posts.filter(p => p.username === username);
      const user = username === (currentUser ? currentUser.username : '') ? currentUser : { displayName: username, username: username, avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${username}` };

      document.getElementById('profileAvatar').src = user ? user.avatar : `https://api.dicebear.com/7.x/bottts/svg?seed=${username}`;
      document.getElementById('profileName').innerText = user ? user.displayName : username;
      document.getElementById('profileUserTag').innerText = username;

      const grid = document.getElementById('profileGrid');
      grid.innerHTML = '';
      userPosts.forEach(p => {
        const isVid = p.src.startsWith('data:video') || p.src.endsWith('.mp4') || p.src.includes('mixkit');
        grid.innerHTML += `<div class="profile-grid-item">${isVid ? `<video src="${p.src}"></video>` : `<img src="${p.src}">`}</div>`;
      });

      modal.classList.add('active');
    }
    function closeProfile() { document.getElementById('profileModal').classList.remove('active'); }

    // Comments Modal
    function openComments(postId) {
      currentPostId = postId;
      const modal = document.getElementById('commentsModal');
      renderCommentsList();
      modal.classList.add('active');
    }
    function closeComments() { document.getElementById('commentsModal').classList.remove('active'); }

    function renderCommentsList() {
      const p = posts.find(x => x.id === currentPostId);
      const list = document.getElementById('commentsList');
      list.innerHTML = '';
      if (!p || !p.comments || p.comments.length === 0) {
        list.innerHTML = `<div style="color:var(--text-muted); text-align:center; padding:20px;">Нет комментариев</div>`;
        return;
      }
      p.comments.forEach(c => {
        list.innerHTML += `
          <div class="comment-item">
            <img src="${c.avatar}" class="comment-avatar">
            <div>
              <strong style="font-size:12px; color:var(--accent-cyan);">${escape(c.displayName)}</strong>
              <p style="font-size:13px; margin-top:2px;">${escape(c.text)}</p>
            </div>
          </div>
        `;
      });
    }

    async function submitComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) return;
      if (!checkSafety(text)) return toast('Запрещенный контент!');

      const p = posts.find(x => x.id === currentPostId);
      if (p) {
        if (!p.comments) p.comments = [];
        p.comments.push({
          displayName: currentUser ? currentUser.displayName : 'Гость',
          avatar: currentUser ? currentUser.avatar : 'https://api.dicebear.com/7.x/bottts/svg?seed=guest',
          text: text
        });
        await savePostToDB(p);
        input.value = '';
        renderCommentsList();
        renderFeed();
      }
    }

    function openUpload() { document.getElementById('uploadModal').classList.add('active'); }
    function closeUpload() { document.getElementById('uploadModal').classList.remove('active'); }

    async function submitPost() {
      const f = document.getElementById('upFile').files[0];
      const d = document.getElementById('upDesc').value.trim();
      const music = document.getElementById('soundCloudSelect').value;

      if (!f) return toast('Выберите медиафайл!');
      if (!checkSafety(d)) return toast('Запрещенный контент!');

      toast('Сохранение в базу...');

      const reader = new FileReader();
      reader.onload = async (e) => {
        const newPost = {
          id: Date.now(),
          src: e.target.result,
          displayName: currentUser ? currentUser.displayName : 'Гость',
          username: currentUser ? currentUser.username : '@guest',
          avatar: currentUser ? currentUser.avatar : 'https://api.dicebear.com/7.x/bottts/svg?seed=guest',
          music: music,
          description: d,
          likes: 0,
          comments: []
        };

        try {
          await savePostToDB(newPost);
          posts.unshift(newPost);
          closeUpload();
          renderFeed();
          toast('Успешно опубликовано!');
        } catch (err) {
          console.error(err);
          toast('Ошибка сохранения файла!');
        }
      };

      reader.readAsDataURL(f);
    }

    function escape(s) { return s.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)); }
  </script>
</body>
</html>
