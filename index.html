<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xok — Shorts, Photos & Streams</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- SVG Иконки -->
  <svg style="display: none;">
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
    <symbol id="icon-comment" viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></symbol>
    <symbol id="icon-share" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></symbol>
    <symbol id="icon-music" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
  </svg>

  <div id="errorToast" class="error-toast"></div>

  <!-- Окно Авторизации (Регистрация / Вход) -->
  <div id="authModal" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabRegisterBtn">Регистрация</button>
        <button class="auth-tab-btn" id="tabLoginBtn">Вход</button>
      </div>

      <!-- Форма Регистрации -->
      <form id="regForm">
        <div class="avatar-preview-wrapper" id="avatarPicker">
          <img id="avatarPreview" class="avatar-preview-img" src="assets/avatars/default.svg" alt="Avatar">
        </div>
        <input type="file" id="customAvatarInput" accept="image/*" style="display:none;">
        
        <div class="form-group">
          <label>Отображаемое имя (Ник)</label>
          <input type="text" id="regDisplayName" class="input-field" placeholder="Миша" required>
        </div>
        <div class="form-group">
          <label>Уникальный @username</label>
          <input type="text" id="regUsername" class="input-field" placeholder="misha_dev" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="regPassword" class="input-field" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-submit-btn">Зарегистрироваться в Xok</button>
      </form>

      <!-- Форма Входа -->
      <form id="loginForm" style="display:none;">
        <div class="form-group">
          <label>Логин (@username)</label>
          <input type="text" id="loginUsername" class="input-field" placeholder="@misha_dev" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required>
        </div>
        <button type="submit" class="auth-submit-btn">Войти в Xok</button>
      </form>
    </div>
  </div>

  <!-- Шапка сайта -->
  <header class="xok-header">
    <div class="feed-nav">
      <button class="nav-tab" id="tabFollowing">Подписки</button>
      <button class="nav-tab active" id="tabForYou">Для вас</button>
      <button class="nav-tab" id="tabLive">Эфиры</button>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="btn-create" id="openUploadBtn">
        <svg class="icon" style="fill:#000; width:16px; height:16px;"><use href="#icon-plus"/></svg>
        Создать
      </button>
      <img id="headerAvatar" class="user-profile-badge" src="assets/avatars/default.svg" alt="Profile">
    </div>
  </header>

  <!-- Лента контента -->
  <div class="xok-container" id="feed"></div>

  <!-- Профиль Пользователя -->
  <div id="profileModal" class="modal-bottom">
    <div class="profile-header-card">
      <img id="profileAvatar" class="profile-avatar-large" src="assets/avatars/default.svg" alt="Avatar">
      <div>
        <h2 id="profileDisplayName" style="font-size:18px;"></h2>
        <span id="profileUsername" style="font-size:13px; color:var(--text-muted);"></span>
        <div style="display:flex; gap:12px; margin-top:8px; font-size:12px;">
          <span>Подписчики: <strong id="profileFollowers">0</strong></span>
          <span>Лайки: <strong id="profileLikes">0</strong></span>
        </div>
      </div>
      <button id="profileLogoutBtn" style="margin-left:auto; background:none; border:1px solid var(--accent-pink); color:var(--accent-pink); padding:6px 10px; border-radius:10px; font-size:12px; cursor:pointer;">Выйти</button>
    </div>
    <div class="profile-grid" id="profilePostsGrid"></div>
  </div>

  <!-- Окно публикации видео/фото -->
  <div id="uploadModal" class="modal-bottom" style="height:80vh;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:10px;">
      <h3>Публикация контента</h3>
      <button id="closeUploadBtn" style="background:none; border:none; color:#fff; cursor:pointer;"><svg class="icon"><use href="#icon-close"/></svg></button>
    </div>
    <div style="overflow-y:auto; flex:1;">
      <div class="form-group">
        <label>Медиафайл (Сохраняется в assets/videos или assets/photos)</label>
        <input type="file" id="uploadFile" class="input-field" accept="video/*,image/*">
      </div>
      <div class="form-group">
        <label>Музыкальная дорожка (из assets/music)</label>
        <select id="uploadMusicSelect" class="input-field">
          <option value="Оригинальный звук">🎵 Оригинальный звук</option>
          <option value="Phonk Drift — Xok Audio">🔥 Phonk Drift — Xok Audio</option>
          <option value="Chill Lofi Beats">🎧 Chill Lofi Beats</option>
        </select>
      </div>
      <div class="form-group">
        <label>Описание ролику</label>
        <textarea id="uploadDesc" class="input-field" rows="3" placeholder="Расскажите о ролике..."></textarea>
      </div>
      <button class="auth-submit-btn" id="submitPostBtn">Опубликовать</button>
    </div>
  </div>

  <!-- Подключение скриптов модулей -->
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/feed.js"></script>
</body>
</html>
